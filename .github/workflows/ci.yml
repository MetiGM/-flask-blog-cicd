name: CI/CD Pipeline

on: [push]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run unit tests
      - name: Run unit tests
        run: |
          python -m pytest tests/

      # Step 5: Debug Environment Variables
      - name: Debug Environment Variables
        run: |
          echo "SONAR_PROJECT_KEY: $SONAR_PROJECT_KEY"
          echo "SONAR_ORGANIZATION: $SONAR_ORGANIZATION"
          echo "SONAR_TOKEN: $SONAR_TOKEN"
          echo "SONAR_HOST_URL: $SONAR_HOST_URL"

      # Step 6: Run SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=MetiGM:flask-blog-cicd
            -Dsonar.organization=metigm
            -Dsonar.python.version=3.12
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Step 7: Start Flask app (for OWASP ZAP Scan)
      - name: Start Flask app
        run: |
          python run.py &

      # Step 8: Run OWASP ZAP Scan
      - name: OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.6.0
        with:
          target: 'http://localhost:5000'
          docker_name: 'owasp/zap2docker-stable'