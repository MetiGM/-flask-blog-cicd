name: Security Analysis
on:
  push:
    branches: [main, vulnerable]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube:
    name: SonarQube Analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MetiGM:flask-blog-cicd
            -Dsonar.organization=metigm
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=${{ github.ref == 'refs/heads/main' }}
            -Dsonar.branch.name=${{ github.ref_name }}
            ${{ github.ref != 'refs/heads/main' && '-Dsonar.branch.target=main' || '' }}

  dynamic-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Flask app
        run: |
          nohup python run.py > flask.log 2>&1 &
          echo "Waiting for Flask to start (max 60 seconds)..."
          for i in {1..30}; do
            if curl -s -o /dev/null http://localhost:5000; then
              echo "Flask app started successfully after $((i*2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Failed to start Flask app - check flask.log"
          cat flask.log
          exit 1

      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.6.0
        with:
          target: 'http://localhost:5000'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: >
            -j "-config scan.rules=40012,40026"
            -r zap-results.xml
            -x junit
          fail_action: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-results
          path: zap-results.xml

      - name: Stop Flask app
        if: always()
        run: pkill -f "python run.py" || true